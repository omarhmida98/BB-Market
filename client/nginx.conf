server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Proxy API requests to backend service.
    # X-Forwarded-Proto MUST be forwarded: the backend sets `secure` session
    # cookies in production and only does so when it sees the original request
    # was HTTPS (trust proxy + X-Forwarded-Proto). Without it, login succeeds but
    # no cookie is issued and every later request is unauthenticated.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /auth/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /attached_assets/ {
        proxy_pass http://backend:3000;
    }

    # Uploaded product images are written by the backend and served by it at
    # /uploads/<file>. Without this, the SPA fallback below swallows the request
    # and every product image renders blank.
    location /uploads/ {
        proxy_pass http://backend:3000;
        client_max_body_size 10M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
