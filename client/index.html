<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8" />

    <title>B&amp;B Market</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />

    <!-- Theme bootstrap. Must stay in <head> and must not be deferred/async: it has
         to run before the body is parsed so the `dark` class is on <html> at first
         paint. See client/public/theme-init.js for why this is not inline. -->
    <script src="/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- The only three families the app actually references: --font-sans (DM Sans),
         --font-display (Outfit) and .font-arabic (Cairo). Weight sets are unchanged
         from the previous @import in index.css, so typography is identical; the
         other 23 families this used to request were never used by any rule. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600&family=Outfit:wght@500;600;700;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6GB0M2MM77"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-6GB0M2MM77');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
