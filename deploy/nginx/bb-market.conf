# =============================================================================
# B&B Market - Nginx production configuration (OVHcloud VPS)
# =============================================================================
# Install:
#   sudo cp deploy/nginx/bb-market.conf /etc/nginx/sites-available/bb-market
#   sudo ln -s /etc/nginx/sites-available/bb-market /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every occurrence of:
#   example.com        -> your real domain
#   /var/www/bb-market -> your checkout directory
#
# Layout produced by `npm run build`:
#   dist/public/     -> Vite frontend build (index.html + hashed assets)
#   dist/server/     -> compiled Express server
#   public/uploads/  -> uploaded images (OUTSIDE dist/, survives a rebuild)
#   attached_assets/ -> static images shipped in the repo
#
# TLS: obtain a certificate before enabling the HTTPS server block.
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d example.com -d www.example.com
# Certbot rewrites this file and adds the ssl_* directives for you.
# =============================================================================


# -----------------------------------------------------------------------------
# HTTP :80 - ACME challenge stays on plain HTTP, everything else redirects.
# Keeping the redirect at the top level (not inside the HTTPS server) means it
# also catches requests for the www host that we are not serving.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Certbot's HTTP-01 validation must remain reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# -----------------------------------------------------------------------------
# HTTPS :443 - the real site.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com www.example.com;

    # --- HTTP/2 --------------------------------------------------------------
    # The `http2 on;` directive requires nginx >= 1.25.1 (Debian 12 / Ubuntu
    # 24.04 and newer). On older releases such as Ubuntu 22.04 (nginx 1.18),
    # delete this line and add `http2` to the listen directives instead:
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    # `nginx -v` will tell you which form you need.
    http2 on;

    # --- TLS -----------------------------------------------------------------
    # certbot --nginx fills these in. The paths below are its defaults on Debian
    # and Ubuntu, which is what OVHcloud VPS images ship.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Security headers ----------------------------------------------------
    # The CSP is deliberately conservative. The app uses inline styles from
    # Tailwind's runtime and a service worker for the PWA, so 'unsafe-inline'
    # is needed for styles. If you add a third-party script, extend script-src
    # explicitly rather than switching to 'unsafe-eval'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Upload limits -------------------------------------------------------
    # Must be >= MAX_UPLOAD_BYTES in the environment file (default 10 MB).
    # Nginx rejects oversized bodies before they consume Node memory.
    client_max_body_size 10M;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    root /var/www/bb-market/dist/public;
    index index.html;

    # --- Proxy headers -------------------------------------------------------
    # These are the headers that make secure-cookie login work.
    #
    # X-Forwarded-Proto tells Express the original request was HTTPS, so
    # req.secure becomes true and Express will actually send the Secure
    # session cookie. Without it, every login silently fails.
    #
    # The Node app is started with `trust proxy 1`, meaning it believes exactly
    # one hop is a proxy. That is this Nginx. Do not use `trust proxy true`:
    # a client could then spoof X-Forwarded-Proto and defeat the Secure flag.
    proxy_http_version 1.1;

    # --- API + auth ----------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Google OAuth entry point. The token exchange itself is server-side, so
    # this only needs to reach Express as well.
    location /auth/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy local image files, plus the directory the local upload fallback
    # writes to. This must stay OUTSIDE the checkout's dist/ directory, because
    # `npm run build` empties dist/ on every deploy. If UPLOADS_DIR is overridden
    # in the environment file, change the root below to match.
    location /uploads/ {
        alias /var/www/bb-market/public/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Static images shipped in the repo (flags, logo). Also outside dist/.
    location /attached_assets/ {
        alias /var/www/bb-market/attached_assets/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # --- Static frontend assets ---------------------------------------------
    # Vite emits content-hashed filenames, so these can be cached forever.
    # Exclude the service worker and manifest: the PWA must always revalidate
    # them or clients get stuck on an old build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /registerSW.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Theme bootstrap, referenced by a blocking <script> in <head>. Not content
    # hashed, so it must never be cached or a fix to it would not reach a browser
    # that already has it.
    location = /theme-init.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- SPA fallback --------------------------------------------------------
    # Every other path is a client-side route (/, /products, /checkout,
    # /admin, /history, ...). Serving index.html is what makes a hard refresh
    # or a shared link work instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}


# -----------------------------------------------------------------------------
# Optional hardening: return 444 for the bare apex vs www duplicate.
# Only enable one of the two server_name blocks above if you do not need both.
# -----------------------------------------------------------------------------
# server {
#     listen 80;
#     server_name www.example.com;
#     return 444;
# }
